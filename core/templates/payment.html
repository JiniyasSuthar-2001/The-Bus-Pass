{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-md">
    <h2 class="text-3xl font-bold mb-6 text-center text-gray-800">Add Money to Wallet</h2>

    <form method="post" class="space-y-6">
        {% csrf_token %}

        <div>
            <label class="block text-gray-700 font-bold mb-2">Amount (₹)</label>
            <input type="number" name="amount" min="1" step="0.01"
                class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="e.g. 500" required>
        </div>

        <div class="border-t pt-4">
            <h3 class="text-lg font-semibold mb-3">Payment Method</h3>

            <div class="space-y-2">
                <label class="flex items-center space-x-3 p-3 border rounded cursor-pointer hover:bg-gray-50">
                    <input type="radio" name="method" value="card" checked class="form-radio h-5 w-5 text-blue-600">
                    <span class="text-gray-900 font-medium">Credit/Debit Card</span>
                    <span class="text-gray-500 text-sm ml-auto">Visa/Mastercard</span>
                </label>

                <label class="flex items-center space-x-3 p-3 border rounded cursor-pointer hover:bg-gray-50">
                    <input type="radio" name="method" value="upi" class="form-radio h-5 w-5 text-blue-600">
                    <span class="text-gray-900 font-medium">UPI</span>
                    <span class="text-gray-500 text-sm ml-auto">GPay/PhonePe</span>
                </label>
            </div>
        </div>

        <!-- Mock Card Fields (Visual Only) -->
        <div class="grid grid-cols-2 gap-4" id="card-details">
            <input type="text" placeholder="Card Number" class="col-span-2 w-full p-2 border rounded text-sm" disabled
                value="4242 4242 4242 4242 (Mock)">
            <input type="text" placeholder="MM/YY" class="w-full p-2 border rounded text-sm" disabled value="12/30">
            <input type="text" placeholder="CVV" class="w-full p-2 border rounded text-sm" disabled value="123">
        </div>

        <button type="submit"
            class="w-full bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700 transition duration-300">
            Pay Securely
        </button>
    </form>

    <div class="mt-4 text-center">
        <a href="{% url 'user_dashboard' %}" class="text-blue-500 hover:underline">Cancel</a>
    </div>
</div>
{% endblock %}
