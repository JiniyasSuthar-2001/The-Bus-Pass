{% extends 'base.html' %}
{% block content %}
<div class="max-w-4xl mx-auto">
    <div class="bg-white p-6 rounded-lg shadow-lg mb-6">
        <h2 class="text-2xl font-bold mb-4 text-gray-800">Conductor Dashboard</h2>
        <p class="mb-4 text-gray-600">Scan User Barcode to verify pass validity.</p>

        <!-- Scanner Section -->
        <div class="relative overflow-hidden rounded-lg bg-black">
            <!-- Scanner Section -->
            <div class="relative overflow-hidden rounded-lg bg-black text-white text-center">
                <div id="reader" style="width: 100%; min-height: 300px;"></div>
                <div id="scanner-controls" class="p-4 bg-gray-900">
                    <button id="start-scan-btn" onclick="startScanner()"
                        class="bg-blue-600 px-6 py-2 rounded font-bold hover:bg-blue-500">
                        📷 Start Camera
                    </button>
                    <div id="scanner-error" class="hidden mt-2 text-red-400 text-sm font-mono"></div>
                </div>
            </div>

            <!-- Manual Entry -->
            <div class="mt-6 border-t pt-4">
                <h3 class="text-lg font-semibold mb-2 text-gray-700">Manual Entry</h3>
                <form method="post" class="flex gap-4">
                    {% csrf_token %}
                    <input type="text" name="barcode_data" placeholder="Enter Barcode ID"
                        class="flex-1 p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required>
                    <button type="submit"
                        class="bg-blue-600 text-white px-6 py-3 rounded-lg font-bold hover:bg-blue-700 transition">Check</button>
                </form>
            </div>
        </div>

        <!-- Result Display -->
        {% if result %}
        <div id="scan-result"
            class="p-6 rounded-lg shadow-md text-center transition-colors duration-500 ease-in-out {% if result.status == 'success' %}bg-green-100 text-green-800 border border-green-200{% else %}bg-red-100 text-red-800 border border-red-200{% endif %}">
            <h3 class="text-3xl font-bold mb-2 icon-animate">
                {% if result.status == 'success' %}✔{% else %}✖{% endif %}
                {{ result.msg }}
            </h3>
            <p class="text-xl">{{ result.detail }}</p>
        </div>
        {% endif %}
    </div>

    <!-- HTML5-QRCode Library -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        #reader video {
            object-fit: cover;
            border-radius: 8px;
        }
    </style>
    <script>
        const html5QrCode = new Html5Qrcode("reader");
        const scanBtn = document.getElementById('start-scan-btn');
        const errorDiv = document.getElementById('scanner-error');
        let isScanning = false;

        function startScanner() {
            if (isScanning) return;

            scanBtn.textContent = "Starting...";
            scanBtn.disabled = true;
            errorDiv.classList.add('hidden');

            const config = { fps: 10, qrbox: { width: 250, height: 150 } };

            // Prefer back camera (environment)
            html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess, onScanFailure)
                .then(() => {
                    isScanning = true;
                    scanBtn.textContent = "Scanning...";
                    scanBtn.classList.remove('bg-blue-600');
                    scanBtn.classList.add('bg-green-600');
                    document.getElementById('scanner-controls').style.display = 'none'; // Hide controls to show full view
                })
                .catch(err => {
                    console.error("Error starting scanner", err);
                    scanBtn.textContent = "Retry Camera";
                    scanBtn.disabled = false;
                    errorDiv.textContent = "Error: " + err;
                    errorDiv.classList.remove('hidden');
                });
        }

        function onScanSuccess(decodedText, decodedResult) {
            // Stop scanning
            html5QrCode.stop().then((ignore) => {
                // Fill and submit
                let input = document.querySelector('input[name="barcode_data"]');
                input.value = decodedText;
                document.querySelector('form').submit();
            }).catch((err) => {
                console.error("Failed to stop.", err);
            });
        }

        function onScanFailure(error) {
            // console.warn(`Code scan error = ${error}`);
        }

        // Auto-dismiss result
        const resultDiv = document.getElementById('scan-result');
        if (resultDiv) {
            setTimeout(function () {
                resultDiv.style.opacity = '0.5';
                resultDiv.style.backgroundColor = 'transparent';
                resultDiv.style.border = 'none';
            }, 3000);
        }
    </script>
    {% endblock %}
