{% extends 'base.html' %}
{% block content %}
<div class="max-w-4xl mx-auto">
    <div class="bg-white p-6 rounded-lg shadow-md mb-6">
        <h2 class="text-2xl font-bold mb-4">Conductor Dashboard</h2>
        <p class="mb-4">Scan User Barcode to verify pass validity.</p>

        <!-- Scanner Section -->
        <div id="reader" style="width: 100%; max-width: 500px; margin: 0 auto;"></div>
        
        <!-- Manual Entry -->
        <div class="mt-6 border-t pt-4">
            <h3 class="text-lg font-semibold mb-2">Manual Entry</h3>
            <form method="post" class="flex gap-4">
                {% csrf_token %}
                <input type="text" name="barcode_data" placeholder="Enter Barcode ID" class="flex-1 p-2 border rounded" required>
                <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">Check</button>
            </form>
        </div>
    </div>

    <!-- Result Display -->
    {% if result %}
    <div class="p-6 rounded-lg shadow-md text-center {% if result.status == 'success' %}bg-green-100 text-green-800{% else %}bg-red-100 text-red-800{% endif %}">
        <h3 class="text-3xl font-bold mb-2">{{ result.msg }}</h3>
        <p class="text-xl">{{ result.detail }}</p>
    </div>
    {% endif %}
</div>

<!-- HTML5-QRCode Library -->
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<script>
    function onScanSuccess(decodedText, decodedResult) {
        // Handle on success condition with the decoded text or result.
        // Auto-submit the form
        console.log(`Scan result: ${decodedText}`, decodedResult);
        let input = document.querySelector('input[name="barcode_data"]');
        input.value = decodedText;
        document.querySelector('form').submit();
        
        // Stop scanning after success to prevent multiple submits
        html5QrcodeScanner.clear();
    }

    function onScanFailure(error) {
        // handle scan failure, usually better to ignore and keep scanning.
        // for example:
        // console.warn(`Code scan error = ${error}`);
    }

    let html5QrcodeScanner = new Html5QrcodeScanner(
        "reader", { fps: 10, qrbox: 250 });
    html5QrcodeScanner.render(onScanSuccess, onScanFailure);
</script>
{% endblock %}
