{% extends 'base.html' %}
{% block content %}
<div class="max-w-2xl mx-auto px-4 py-8">
    <!-- Progress Indicator -->
    <div class="flex items-center justify-center mb-8 space-x-4">
        <div class="flex items-center">
            <div class="w-8 h-8 bg-teal-500 text-white rounded-full flex items-center justify-center font-bold">✓</div>
            <span class="ml-2 font-medium text-teal-600">Amount</span>
        </div>
        <div class="h-1 w-16 bg-teal-500"></div>
        <div class="flex items-center">
            <div class="w-8 h-8 bg-teal-500 text-white rounded-full flex items-center justify-center font-bold">2</div>
            <span class="ml-2 font-medium text-teal-600">Confirm</span>
        </div>
        <div class="h-1 w-16 bg-gray-300"></div>
        <div class="flex items-center">
            <div class="w-8 h-8 bg-gray-300 text-gray-500 rounded-full flex items-center justify-center font-bold">3
            </div>
            <span class="ml-2 text-gray-500">Done</span>
        </div>
    </div>

    <div class="bg-white rounded-xl shadow-lg overflow-hidden">
        <div class="p-6 sm:p-10 text-center">
            <h2 class="text-2xl font-bold text-gray-800 mb-2">Confirm Payment</h2>
            <p class="text-gray-500 mb-8">Please review the details below</p>

            <div class="bg-gray-50 p-6 rounded-lg mb-8 inline-block w-full max-w-sm">
                <p class="text-gray-600 mb-1">Total Amount</p>
                <div class="text-4xl font-bold text-gray-800">₹{{ amount }}</div>
                <div class="mt-4 text-xs text-gray-400">Order ID: {{ order_id }}</div>
            </div>

            <!-- Razorpay Button -->
            <button id="rzp-button1"
                class="w-full max-w-sm bg-[#1ABC9C] text-white font-bold py-4 rounded-lg hover:bg-teal-600 transition duration-300 shadow-md hover:shadow-lg transform hover:-translate-y-0.5">
                Pay Now
            </button>
        </div>

        <div class="bg-gray-50 px-6 py-4 text-center border-t border-gray-100">
            <a href="{% url 'payment_page' %}" class="text-gray-500 hover:text-gray-700 text-sm font-medium">Cancel
                Transaction</a>
        </div>
    </div>
</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
    var options = {
        "key": "{{ key_id }}", // Enter the Key ID generated from the Dashboard
        "amount": "{{ amount_paise }}", // Amount is in currency subunits. Default currency is INR. Hence, 50000 refers to 50000 paise
        "currency": "INR",
        "name": "Bus Pass System",
        "description": "Wallet Refill",
        "image": "https://example.com/your_logo",
        "order_id": "{{ order_id }}", //This is a sample Order ID. Pass the `id` obtained in the response of Step 1
        "handler": function (response) {
            // Success Handler
            // Post the Payment ID to backend to verify
            var form = document.createElement("form");
            form.method = "POST";
            form.action = "{% url 'payment_success' %}";

            var field1 = document.createElement("input");
            field1.type = "hidden";
            field1.name = "razorpay_payment_id";
            field1.value = response.razorpay_payment_id;
            form.appendChild(field1);

            var field2 = document.createElement("input");
            field2.type = "hidden";
            field2.name = "razorpay_order_id";
            field2.value = response.razorpay_order_id;
            form.appendChild(field2);

            var field3 = document.createElement("input");
            field3.type = "hidden";
            field3.name = "razorpay_signature";
            field3.value = response.razorpay_signature;
            form.appendChild(field3);

            document.body.appendChild(form);
            form.submit();
        },
        "prefill": {
            "name": "{{ user.username }}",
            "email": "{{ user_email }}",
            "contact": "{{ user_phone }}"
        },
        "theme": {
            "color": "#5D5CDE"
        },
        "modal": {
            "ondismiss": function () {
                alert('Payment Cancelled');
                window.location.href = "{% url 'payment_page' %}";
            }
        }
    };
    var rzp1 = new Razorpay(options);
    document.getElementById('rzp-button1').onclick = function (e) {
        rzp1.open();
        e.preventDefault();
    }
    // Optionally open automatically
    // rzp1.open();
</script>
{% endblock %}
